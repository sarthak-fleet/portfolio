name: Portfolio CI / Deploy

# Builds the site on every push to main. Production deploys are manual.
# Requires one repo secret: CLOUDFLARE_API_TOKEN (a token with the
# "Cloudflare Pages — Edit" permission). The account ID below is not secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d048325699a5acddb44d3be31cf6ba9
          command: pages deploy dist --project-name=sarthakagrawal --branch=main

      - name: Skip deploy without Cloudflare token
        if: github.event_name == 'workflow_dispatch' && env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not configured, so this run built the site but skipped Cloudflare Pages deploy."
