name: Build résumé PDF

# Compiles resume.tex → public/resume.pdf with a full TeX Live toolchain
# and commits the result, so the site's "Download PDF" button always serves
# the current, real LaTeX résumé. No local LaTeX install needed.

on:
  push:
    paths:
      - 'resume.tex'
      - '.github/workflows/resume.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Move PDF into public/
        run: |
          mkdir -p public
          mv resume.pdf public/resume.pdf

      - name: Commit PDF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild résumé PDF"
          git push
