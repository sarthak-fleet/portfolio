<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1d1f23" stroke-width="1" />
    </pattern>
    <radialGradient id="fade" cx="30%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#08090a" stop-opacity="0" />
      <stop offset="100%" stop-color="#08090a" stop-opacity="0.92" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#08090a" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#fade)" />
  <rect x="20" y="20" width="1160" height="590" rx="18" fill="none" stroke="#2c2f35" />

  <!-- node mark -->
  <g transform="translate(80 78)">
    <g stroke="#48e5c2" stroke-width="3" stroke-linecap="round">
      <line x1="9" y1="9" x2="9" y2="39" />
      <line x1="9" y1="9" x2="42" y2="24" />
      <line x1="9" y1="39" x2="42" y2="24" />
    </g>
    <g fill="#48e5c2">
      <circle cx="9" cy="9" r="6.5" />
      <circle cx="9" cy="39" r="6.5" />
      <circle cx="42" cy="24" r="7.5" />
    </g>
    <text x="68" y="38" font-family="ui-monospace, monospace" font-size="26" fill="#e7e8ea" font-weight="500">Sarthak Agrawal</text>
  </g>

  <!-- headline -->
  <text x="80" y="290" font-family="ui-monospace, monospace" font-size="22" letter-spacing="4" fill="#48e5c2">// AI INFRASTRUCTURE ENGINEER</text>
  <text x="76" y="385" font-family="ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="600" fill="#e7e8ea">I build the backend &amp;</text>
  <text x="76" y="475" font-family="ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="600" fill="#e7e8ea">infrastructure <tspan fill="#48e5c2">AI runs on.</tspan></text>

  <!-- footer line -->
  <line x1="80" y1="528" x2="1120" y2="528" stroke="#1d1f23" />
  <text x="80" y="565" font-family="ui-monospace, monospace" font-size="21" fill="#898d96">Distributed systems · Low-latency APIs · LLM serving</text>
  <text x="1120" y="565" text-anchor="end" font-family="ui-monospace, monospace" font-size="21" fill="#585c64">sarthakagrawal.dev</text>
